  { verborgen: true, naam: "Japan", icoon: "🇯🇵", videos: ["1VDWzAgNzUs", "a2gfO60JchM", "p6CgWQcxazo", "1tMK8bTHMY4", "vPy-P8PwQXE", "9A3PcR13z2I", "S_M50bllQ_w", "MkdsvjGZv7U", "zRhYnTnJ3fI", "ggshbKlKsQE", "KloB_5r_HKM", "yHszHGUsg48", "zUzLSpMOX58", "3BlVz4Rrj5k"] }
];
var BALK_VERBERGEN_NA = 6;   // seconden voor knoppen verdwijnen
/* ===================================================================== */

var speler = null, spelerKlaar = false, huidige = null, lijst = [], positie = 0, verbergTimer = null;

function haalId(s) {
  s = String(s).trim();
  var m = s.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (m && s.indexOf("v=") === -1 && s.indexOf("youtu.be") === -1) return { playlist: m[1] };
  m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  if (m) return { video: m[1] };
  if (/^(PL|UU|OL)[A-Za-z0-9_-]+$/.test(s)) return { playlist: s };
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return { video: s };
  return null;
}
function schud(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function bouwLijst(b) {
  var bron = b.videos, uit = [];
  if (bron === "ALLES") { bron = []; for (var i = 0; i < BESTEMMINGEN.length; i++) if (BESTEMMINGEN[i].videos !== "ALLES") bron = bron.concat(BESTEMMINGEN[i].videos); }
  for (var k = 0; k < bron.length; k++) { var id = haalId(bron[k]); if (id) uit.push(id); }
  return schud(uit);
}

/* --- keuzescherm --- */
var tegels = document.getElementById("tegels");
for (var i = 0; i < BESTEMMINGEN.length; i++) (function (b) {
  if (b.verborgen) return;
  var d = document.createElement("div");
  d.className = "tegel";
  var foto = (b.videos === "ALLES") ? null : haalId(b.videos[0]);
  if (foto && foto.video) d.style.backgroundImage = "url(https://i.ytimg.com/vi/" + foto.video + "/hqdefault.jpg)";
  if (b.foto === "dobbel") { d.className = "tegel dobbel"; d.innerHTML = "<div class='groot'>🎲</div><div class='label'>Verrassing</div>"; }
  else d.innerHTML = "<div class='label'><span>" + b.icoon + "</span> " + b.naam + "</div>";
  d.addEventListener("click", function () { start(b); });
  tegels.appendChild(d);
})(BESTEMMINGEN[i]);

/* --- YouTube-speler --- */
var tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = function () {
  speler = new YT.Player("speler", {
    width: "100%", height: "100%",
    playerVars: { autoplay: 0, controls: 0, rel: 0, modestbranding: 1, playsinline: 1,
                  iv_load_policy: 3, fs: 0, disablekb: 1, cc_load_policy: 0, hl: "nl" },
    events: {
      onReady: function () { spelerKlaar = true; },
      onStateChange: function (e) {
        if (e.data === YT.PlayerState.PLAYING) document.getElementById("laden").style.display = "none";
        if (e.data === YT.PlayerState.ENDED) volgende();           // automatisch verder
      },
      onError: function () { setTimeout(volgende, 1500); }           // video niet insluitbaar → overslaan
    }
  });
};

function speel(item) {
  document.getElementById("laden").style.display = "block";
  if (item.playlist) speler.loadPlaylist({ listType: "playlist", list: item.playlist, index: 0 });
  else speler.loadVideoById(item.video);
  // playlist: willekeurige volgorde + herhalen
  if (item.playlist) setTimeout(function () { try { speler.setShuffle(true); speler.setLoop(true); speler.playVideoAt(0); } catch (e) {} }, 1500);
}
function volgende() {
  if (!lijst.length) return;
  if (lijst[positie] && lijst[positie].playlist) { try { speler.nextVideo(); return; } catch (e) {} }
  positie = (positie + 1) % lijst.length;
  speel(lijst[positie]);
}

function start(b) {
  lijst = bouwLijst(b); positie = 0; huidige = b;
  if (!lijst.length) { alertZacht("Voor " + b.naam + " zijn nog geen video's ingesteld."); return; }
  if (!spelerKlaar) { alertZacht("Even geduld, de speler laadt nog…"); return; }
  document.getElementById("menu").style.display = "none";
  document.getElementById("speler-scherm").style.display = "block";
  document.getElementById("titel").innerHTML = b.icoon + " " + b.naam;
  speel(lijst[0]);
  toonBalk();
}
function terug() {
  try { speler.stopVideo(); } catch (e) {}
  document.getElementById("speler-scherm").style.display = "none";
  document.getElementById("menu").style.display = "block";
}
function toonBalk() {
  document.getElementById("balk").className = "";
  document.getElementById("titel").className = "";
  clearTimeout(verbergTimer);
  verbergTimer = setTimeout(function () {
    document.getElementById("balk").className = "verborgen";
    document.getElementById("titel").className = "verborgen";
  }, BALK_VERBERGEN_NA * 1000);
}
function alertZacht(t) {
  var h = document.querySelector("h1"), oud = "Waar wil je wandelen?";
  h.innerHTML = t; setTimeout(function () { h.innerHTML = oud; }, 3000);
}

document.getElementById("schild").addEventListener("click", toonBalk);
document.getElementById("knop-terug").addEventListener("click", terug);
document.getElementById("knop-andere").addEventListener("click", function () { volgende(); toonBalk(); });
</script>
</body>
</html>
